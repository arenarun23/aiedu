<!-- AIEDU 허브로 가는 아이콘: 모든 서비스 공통 모양·위치(페이지 왼쪽 위, body 첫 요소). 아래 <style> 은 앱의 <style> 에 넣고, <a> 는 <body> 바로 다음에 넣는다.
     앱마다 이 자리(왼쪽 위 52×52px)를 비워 주는 CSS 가 따로 필요하다: 제목 줄이면 .top{padding-left:52px}, 패널이면 위쪽 padding 등. -->
<style>

.aiedu-home:focus-visible{outline:3px solid #f08a00;outline-offset:2px}
</style>
