<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIEDU - 놀면서 배우는 AI 교실</title>
<meta name="description" content="유아와 초등 저학년을 위한 놀이 서비스 모음, AIEDU">
<meta name="theme-color" content="#fff3d6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="AIEDU">
<link rel="stylesheet" href="fonts/jua.css">
<link rel="stylesheet" href="fonts/gowun-dodum.css">
<style>
  :root{
    --bg1:#fff3d6; --bg2:#ffe3ef; --ink:#4a3426; --ink-soft:#8a6f5c;
    --card:#ffffff;
    --pink:#ff8fb4;  --pink-bg:#ffe1ec;
    --sky:#5fbcff;   --sky-bg:#dff1ff;
    --orange:#ffa94d;--orange-bg:#ffedd3;
    --mint:#4fd1a1;  --mint-bg:#d9f7ea;
    --lemon:#f3c623; --lemon-bg:#fff6c9;
    --lilac:#b39bff; --lilac-bg:#ece6ff;
    --peach:#ff9a82; --peach-bg:#ffe5de;
    --cols:4; --k:1;
    --u:min(1vw,calc(1.6vh*var(--k)));
    --font:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; background:var(--bg2)}
  body{
    margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; color:var(--ink); font-family:var(--font);
    background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%) fixed;
    overflow-x:hidden; position:relative;
  }

  /* 떠다니는 장식 */
  .deco{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
  .deco span{position:absolute; font-size:clamp(22px,4vw,40px); opacity:.55; animation:float 7s ease-in-out infinite}
  .deco span:nth-child(1){left:6%;  top:12%; animation-delay:0s}
  .deco span:nth-child(2){left:88%; top:9%;  animation-delay:-1.5s}
  .deco span:nth-child(3){left:14%; top:68%; animation-delay:-3s}
  .deco span:nth-child(4){left:82%; top:62%; animation-delay:-4.5s}
  .deco span:nth-child(5){left:48%; top:4%;  animation-delay:-2s}
  .deco span:nth-child(6){left:92%; top:86%; animation-delay:-5s}
  .deco span:nth-child(7){left:4%;  top:90%; animation-delay:-1s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}

  /* 화면 크기에 맞춰 자동 조절: --u 는 가로·세로 중 작은 쪽에 비례하는 기준 단위 */
  main{position:relative; z-index:1; width:100%; max-width:1100px; margin:0 auto; flex:1;
       display:flex; flex-direction:column; justify-content:center;
       padding:calc(var(--u)*2.4) 16px calc(var(--u)*1.2)}

  /* 머리글 */
  header{text-align:center; margin-bottom:calc(var(--u)*2.2)}
  .logo{display:flex; justify-content:center; gap:clamp(2px,.7vw,8px); margin:0; line-height:1;
        font-size:clamp(46px,calc(var(--u)*9.5),120px); font-weight:400}
  .logo span{display:inline-block; text-shadow:0 .05em 0 rgba(74,52,38,.14); animation:bounce 2.4s ease-in-out infinite}
  .logo span:nth-child(1){color:var(--pink)}
  .logo span:nth-child(2){color:var(--orange);animation-delay:.15s}
  .logo span:nth-child(3){color:var(--lemon); animation-delay:.3s}
  .logo span:nth-child(4){color:var(--mint);  animation-delay:.45s}
  .logo span:nth-child(5){color:var(--sky);   animation-delay:.6s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.12em)}}
  .tagline{display:inline-block; margin:calc(var(--u)*1.1) 0 0; padding:.4em 1.1em; background:rgba(255,255,255,.8);
           border-radius:999px; font-size:clamp(14px,calc(var(--u)*2),22px); color:var(--ink-soft);
           box-shadow:0 4px 0 rgba(74,52,38,.08)}
  .lead{margin:calc(var(--u)*1.2) 0 0; font-size:clamp(16px,calc(var(--u)*2.6),26px)}

  /* 카드 */
  .grid{display:flex; flex-wrap:wrap; justify-content:center; gap:calc(var(--u)*2); list-style:none; margin:0; padding:0}
  .grid > li{flex:0 1 calc((100% - var(--u)*2*(var(--cols) - 1))/var(--cols)); min-width:0; max-width:270px}
  .card{
    --c:var(--pink); --cbg:var(--pink-bg);
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:calc(var(--u)*.5);
    height:100%; padding:calc(var(--u)*2) calc(var(--u)*1.4) calc(var(--u)*1.8); color:inherit; text-decoration:none;
    background:var(--card); border:clamp(3px,calc(var(--u)*.4),4px) solid var(--c); border-radius:calc(var(--u)*2.8);
    box-shadow:0 calc(var(--u)*.7) 0 var(--c), 0 calc(var(--u)*1.6) calc(var(--u)*2.6) rgba(74,52,38,.12);
    transition:transform .18s cubic-bezier(.3,1.6,.5,1), box-shadow .18s;
    -webkit-tap-highlight-color:transparent;
  }
  .grid li:nth-child(odd) .card{transform:rotate(-1.5deg)}
  .grid li:nth-child(even) .card{transform:rotate(1.5deg)}
  .card:hover,.card:focus-visible{transform:translateY(-6px) rotate(0) scale(1.03); box-shadow:0 calc(var(--u)*1.2) 0 var(--c), 0 calc(var(--u)*2.2) calc(var(--u)*3) rgba(74,52,38,.16); outline:none}
  .card:focus-visible{outline:4px dashed var(--ink); outline-offset:4px}
  .card:active{transform:translateY(2px) scale(.98); box-shadow:0 4px 0 var(--c)}
  .badge{
    --b:clamp(60px,calc(var(--u)*9),104px);
    display:grid; place-items:center; width:var(--b); height:var(--b); border-radius:50%;
    background:var(--cbg); border:clamp(3px,calc(var(--u)*.4),4px) dashed var(--c);
    font-size:calc(var(--b)*.48); line-height:1; margin-bottom:calc(var(--u)*.4);
  }
  .card:hover .badge,.card:focus-visible .badge{animation:wiggle .6s ease-in-out}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.08)}75%{transform:rotate(12deg) scale(1.08)}}
  .name{font-size:clamp(17px,calc(var(--u)*2.5),26px); line-height:1.25}
  .desc{font-family:"Gowun Dodum",var(--font); font-size:clamp(12px,calc(var(--u)*1.65),16px); color:var(--ink-soft); line-height:1.4; word-break:keep-all}
  .go{
    margin-top:auto; padding:.5em 1.4em; border-radius:999px; background:var(--c); color:#fff;
    font-size:clamp(14px,calc(var(--u)*1.9),18px); box-shadow:0 4px 0 rgba(74,52,38,.2); text-shadow:0 1px 0 rgba(0,0,0,.12);
  }
  .card.pink{--c:var(--pink);--cbg:var(--pink-bg)}   .card.sky{--c:var(--sky);--cbg:var(--sky-bg)}
  .card.orange{--c:var(--orange);--cbg:var(--orange-bg)} .card.mint{--c:var(--mint);--cbg:var(--mint-bg)}
  .card.lemon{--c:var(--lemon);--cbg:var(--lemon-bg)} .card.lilac{--c:var(--lilac);--cbg:var(--lilac-bg)}
  .card.peach{--c:var(--peach);--cbg:var(--peach-bg)}

  .empty{width:100%; text-align:center; font-size:22px; padding:40px 0; list-style:none}
  footer{position:relative; z-index:1; text-align:center; padding:4px 16px calc(var(--u)*1.6); color:var(--ink-soft); font-size:clamp(12px,calc(var(--u)*1.5),15px)}

  /* 세로 화면·좁은 화면: 2열로 */
  @media (orientation:portrait), (max-width:720px){
    .grid > li{max-width:none}
  }
  /* 가로로 눕힌 낮은 화면: 안내 문구를 접어 공간 확보 */
  @media (max-height:520px) and (orientation:landscape){
    .lead{display:none} header{margin-bottom:calc(var(--u)*1.4)}
  }
  /* 아주 낮은 화면: 카드 설명을 접고 아이콘을 줄여 여러 줄도 한 화면에 */
  @media (max-height:460px){
    .desc{display:none} .badge{--b:clamp(40px,calc(var(--u)*8),90px)}
    .logo{font-size:clamp(32px,calc(var(--u)*9.5),120px)} footer{padding-bottom:6px} main{padding-top:calc(var(--u)*1.4)}
    .card{padding-top:calc(var(--u)*1.2); padding-bottom:calc(var(--u)*1.2)}
  }
  /* 작은 폰(세로): 안내 문구를 접어 공간 확보 */
  @media (max-height:700px) and (orientation:portrait){ .lead{display:none} .logo{font-size:clamp(38px,calc(var(--u)*9.5),120px)} header{margin-bottom:calc(var(--u)*1.6)} }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><span>⭐</span><span>☁️</span><span>🌈</span><span>🎈</span><span>✨</span><span>🍀</span><span>🌷</span></div>

<main>
  <header>
    <h1 class="logo" aria-label="AIEDU"><span>A</span><span>I</span><span>E</span><span>D</span><span>U</span></h1>
    <p class="tagline">놀면서 배우는 AI 교실</p>
    <p class="lead">오늘은 무엇을 하고 놀까요? 🎒</p>
  </header>

  <ul class="grid" id="grid" aria-live="polite"></ul>
</main>

<footer>© AIEDU · 즐겁게 놀고, 쑥쑥 자라요 🌱</footer>

<script>
(function(){
  var grid=document.getElementById('grid');
  // 카드 개수와 화면 방향에 맞춰 열 수·크기 배율을 정한다(예: 5개 → 3+2, 가로 4열/세로 2열)
  var narrowMQ=window.matchMedia('(orientation:portrait), (max-width:720px)');
  var count=0;
  function layout(){
    if(!count)return;
    var maxCols=narrowMQ.matches?2:4, rows=Math.ceil(count/maxCols), cols=Math.ceil(count/rows);
    var k=[1,1,.68,.5,.42][Math.min(rows,4)];
    var st=document.documentElement.style; st.setProperty('--cols',cols); st.setProperty('--k',k);
  }
  if(narrowMQ.addEventListener)narrowMQ.addEventListener('change',layout);else narrowMQ.addListener(layout);
  var COLORS=['pink','sky','orange','mint','lemon','lilac','peach'];
  function msg(t){var li=document.createElement('li');li.className='empty';li.textContent=t;grid.appendChild(li);}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  fetch('apps.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(apps){
    if(!apps.length){msg('곧 새로운 놀이가 찾아와요! 🎈');return;}
    count=apps.length; layout();
    apps.forEach(function(a,i){
      var color=COLORS.indexOf(a.color)>-1?a.color:COLORS[i%COLORS.length];
      var li=document.createElement('li');
      var link=el('a','card '+color);
      link.href=a.href;
      link.target='_blank'; link.rel='noopener';
      link.setAttribute('aria-label',a.name+' 놀러가기 (새 창)');
      link.appendChild(el('div','badge',a.icon));
      link.appendChild(el('div','name',a.name));
      link.appendChild(el('div','desc',a.desc||''));
      link.appendChild(el('div','go','놀러가기 ▶'));
      li.appendChild(link);grid.appendChild(li);
    });
  }).catch(function(){msg('앗, 놀이 목록을 못 불러왔어요. 새로고침 해 주세요! 🔄');});
})();
</script>
</body>
</html>
