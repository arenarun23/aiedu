<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>관리</title>
<style>
  :root{--bg:#f6f3ee;--fg:#241f1a;--soft:#7a6f62;--card:#fff;--line:#e3dccf;--accent:#d9552b;--ok:#2b8a5b;--bar:#f0a15a}
  @media (prefers-color-scheme:dark){:root{--bg:#171512;--fg:#eee7dc;--soft:#a39a8c;--card:#211e1a;--line:#38332c;--accent:#ff8a63;--ok:#59c48f;--bar:#c97f3a}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}
  header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
  h1{font-size:1.05rem;margin:0} main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--soft);margin-right:6px}
  .pill.on{color:var(--ok);border-color:var(--ok)} .pill.off{color:var(--accent);border-color:var(--accent)}
  nav{display:flex;gap:6px;margin:12px 0} nav button,.btn{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-height:40px;text-decoration:none;display:inline-block}
  nav button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:560px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap} th{font-size:.8rem;color:var(--soft);font-weight:600}
  tr.click{cursor:pointer} tr.click:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .bar{height:10px;border-radius:5px;background:var(--bar)} .track{flex:1;min-width:0} .row{display:flex;align-items:center;gap:10px;margin:6px 0} .row .name{width:84px;flex:none} .row .val{width:84px;flex:none;text-align:right;white-space:nowrap}
  .soft{color:var(--soft)} .danger{border-color:var(--accent);color:var(--accent)} .hidden{display:none} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .num{font-size:1.5rem;font-weight:700} #msg{padding:40px 16px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<div id="msg">…</div>
<div id="app" class="hidden">
  <header>
    <h1>관리</h1>
    <div id="status"></div>
  </header>
  <main>
    <nav role="tablist" aria-label="보기">
      <button role="tab" data-tab="summary" aria-selected="true">요약</button>
      <button role="tab" data-tab="devices" aria-selected="false">기기</button>
      <button role="tab" data-tab="tools" aria-selected="false">도구</button>
    </nav>
    <section id="t-summary">
      <div class="card"><span class="soft">기간</span>
        <button class="btn" data-days="1">오늘</button> <button class="btn" data-days="7">7일</button> <button class="btn" data-days="30">30일</button>
        <span class="soft" id="range"></span></div>
      <div class="grid" id="kpi"></div>
      <div class="card"><b>서비스별 이용 시간</b><div id="bars"></div></div>
      <div class="card"><b>서비스별 합계</b><table id="svcTable"></table></div>
      <div class="card"><b>날짜별</b><table id="dayTable"></table></div>
    </section>
    <section id="t-devices" class="hidden">
      <div class="card"><table id="devTable"></table></div>
      <div id="detail" class="card hidden"></div>
    </section>
    <section id="t-tools" class="hidden">
      <div class="card"><b>내보내기</b><p class="soft">기기 목록을 CSV 파일로 받습니다(최대 500대).</p><a class="btn" id="csv" href="../api/admin?op=export">CSV 받기</a></div>
      <div class="card"><b>전체 삭제</b><p class="soft">저장된 모든 기록(기기·이벤트·일별 집계)을 지웁니다. 되돌릴 수 없습니다.</p>
        <input id="confirm" placeholder="삭제" size="6" aria-label="확인 문구"> <button class="btn danger" id="purge">전체 삭제</button> <span id="purgeMsg" class="soft"></span></div>
      <div class="card"><b>이 브라우저</b><p class="soft">접속 기억을 지웁니다. 다시 보려면 비밀 링크가 필요합니다.</p><button class="btn" id="logout">로그아웃</button></div>
    </section>
  </main>
</div>
<script src="admin.js"></script>
</body>
</html>
